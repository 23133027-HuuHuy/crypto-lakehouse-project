services:
  # ==========================================
  # LỚP 1: INGESTION - KAFKA KRAFT (KHÔNG CẦN ZOOKEEPER NỮA)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"   # Cho Spark gọi
      - "29092:29092" # Cho Python ở ngoài gọi
    environment:
      # Bật chế độ KRaft (Thay thế hoàn toàn Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Chuỗi Base64 ID bắt buộc của KRaft
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================
  # LỚP 2: STORAGE (LƯU TRỮ GỐC)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # ==========================================
  # LỚP 4: COMPUTE TỐI ƯU (SPARK LOCAL MODE TRONG DOCKER)
  # ==========================================
  # Bỏ đi cụm Master/Worker cồng kềnh (tốn >3GB RAM).
  # Sử dụng một Container ảo gọn nhẹ chứa sẵn môi trường Java + PySpark cho Data Engineer.
  spark-env:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    container_name: lakehouse-spark-env
    volumes:
      - ../:/app
    depends_on:
      - kafka
      - minio
    # Trick để container sống chờ lệnh (idle), có thể 'docker-compose exec' vào bất cứ lúc nào
    entrypoint: ["tail", "-f", "/dev/null"]

  # ==========================================
  # LỚP 5: QUERY ENGINE - TRINO (CHO BI TOOLS)
  # ==========================================
  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio

  # ==========================================
  # LỚP 6: VISUALIZATION - METABASE
  # ==========================================
  metabase:
    image: metabase/metabase:latest
    container_name: lakehouse-metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
    depends_on:
      - trino

  # ==========================================
  # LỚP 7: REST API - GOLD LAYER API
  # ==========================================
  gold-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    container_name: lakehouse-gold-api
    ports:
      - "5000:5000"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - API_PORT=5000
      - FLASK_DEBUG=false
    volumes:
      - ../:/app
    depends_on:
      - minio
    command: ["python", "/app/api/gold_api.py"]