services:
  # ==========================================
  # LỚP 1: INGESTION - KAFKA KRAFT (KHÔNG CẦN ZOOKEEPER NỮA)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"   # Cho Spark gọi
      - "29092:29092" # Cho Python ở ngoài gọi
    environment:
      # Bật chế độ KRaft (Thay thế hoàn toàn Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Chuỗi Base64 ID bắt buộc của KRaft
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================
  # LỚP 2: STORAGE (LƯU TRỮ GỐC)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # ==========================================
  # LỚP 4: API & COMPUTE (XỬ LÝ - SPARK)
  # ==========================================
  spark-master:
    image: bitnamilegacy/spark:latest
    container_name: lakehouse-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    volumes:
      - ./workspace:/workspace

  spark-worker:
    image: bitnamilegacy/spark:latest
    container_name: lakehouse-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./workspace:/workspace
    depends_on:
      - spark-master